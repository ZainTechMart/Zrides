<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides Partner - ڈرائیور پورٹل</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #333; }
        header { background-color: #1e293b; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .logo { font-size: 24px; font-weight: bold; color: #10b981; }
        .back-btn { background-color: #10b981; color: white; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        .stats-bar { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card h4 { color: #64748b; font-size: 14px; margin-bottom: 5px; }
        .stat-card h2 { color: #0f172a; font-size: 24px; }
        .dashboard-container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
        .panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 15px; }
        .panel-title { font-size: 18px; font-weight: bold; color: #0f172a; }
        .order-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background-color: #f0fdf4; border-right: 5px solid #10b981; }
        .order-type { display: inline-block; background-color: #10b981; color: white; font-size: 12px; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; }
        .order-info { font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
        .order-fare { font-size: 18px; font-weight: bold; color: #059669; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-accept { flex: 1; background-color: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-accept:hover { background-color: #059669; }
        .btn-reject { flex: 1; background-color: #ef4444; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #driverMap { height: 450px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zrides Partner 🏍️</div>
        <a href="index.html" class="back-btn">کسٹمر سائٹ (Website)</a>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <h4>آج کی کمائی (Earnings)</h4>
            <h2 id="totalEarnings">Rs. 0</h2>
        </div>
        <div class="stat-card">
            <h4>مکمل سواریاں (Rides)</h4>
            <h2 id="totalRides">0</h2>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">لائیو آرڈرز (Live Requests)</span>
                <span style="font-size: 12px; color: #64748b;" id="liveCount">آرڈرز کا انتظار ہے...</span>
            </div>
            <div id="ordersContainer">
                <p style="text-align: center; color: #888; padding: 20px;">کوئی نیا آرڈر موجود نہیں ہے۔ جب کسٹمر بک کرے گا تو یہاں ظاہر ہوگا۔</p>
            </div>
        </div>
        <div>
            <div id="driverMap"></div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://zrides-default-rtdb.firebaseio.com/" // وہی ڈیٹا بیس لنک جو اوپر استعمال کیا
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        var earnings = 0;
        var ridesCount = 0;

        var map = L.map('driverMap').setView([31.5204, 74.3587], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        L.marker([31.5204, 74.3587]).addTo(map).bindPopup('آپ کی لوکیشن').openPopup();

        // Listen for live orders from Firebase database
        db.ref('orders/').on('value', function(snapshot) {
            var container = document.getElementById('ordersContainer');
            container.innerHTML = "";
            var data = snapshot.val();
            
            if (!data) {
                container.innerHTML = '<p style="text-align: center; color: #888; padding: 20px;">کوئی نیا آرڈر موجود نہیں ہے۔</p>';
                document.getElementById('liveCount').innerText = "0 آرڈر";
                return;
            }

            var count = 0;
            Object.keys(data).forEach(function(key) {
                var order = data[key];
                if (order.status === 'pending') {
                    count++;
                    var cardHTML = `
                        <div class="order-card" id="card-${key}">
                            <span class="order-type">${order.service}</span>
                            <div class="order-info">
                                <p><strong>پک اپ:</strong> ${order.pickup}</p>
                                <p><strong>ڈراپ:</strong> ${order.dropoff}</p>
                                <p><strong>فاصلہ:</strong> ${order.distance} کلومیٹر</p>
                                <p><strong>فون:</strong> ${order.phone}</p>
                                <p><strong>وقت:</strong> ${order.time}</p>
                            </div>
                            <div class="order-fare">کرایہ: ${order.fare}</div>
                            <div class="btn-group">
                                <button class="btn-accept" onclick="acceptOrder('${key}', '${order.fare}')">قبول کریں (Accept)</button>
                                <button class="btn-reject" onclick="rejectOrder('${key}')">مسترد کریں</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                }
            });

            document.getElementById('liveCount').innerText = count + " نئے آرڈرز";
        });

        function acceptOrder(orderKey, fareStr) {
            // Update order status in Firebase
            db.ref('orders/' + orderKey).update({ status: 'accepted' });
            
            alert("مبارک ہو! آپ نے آرڈر قبول کر لیا ہے۔");
            
            // Add earnings (Extract numeric value from fare string)
            var numericFare = parseInt(fareStr.replace(/[^0-9]/g, '')) || 150;
            earnings += numericFare;
            ridesCount += 1;

            document.getElementById('totalEarnings').innerText = "Rs. " + earnings;
            document.getElementById('totalRides').innerText = ridesCount;
        }

        function rejectOrder(orderKey) {
            db.ref('orders/' + orderKey).update({ status: 'rejected' });
        }
    </script>
</body>
</html>
