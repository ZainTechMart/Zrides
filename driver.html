<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Zrides | Driver Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#4ade80}
select,input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;background:white}
header select{width:auto}
button{padding:11px 14px;border:0;border-radius:8px;background:#16a34a;color:white;font-weight:bold;cursor:pointer}
main{max-width:900px;margin:24px auto;padding:0 15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
.field{margin:14px 0}
label{display:block;font-weight:bold;margin-bottom:7px}
.muted{color:#6b7280;font-size:14px;line-height:1.5}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:15px;overflow-wrap:anywhere}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
.ride{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.hidden{display:none!important}
.chatMessages{height:170px;overflow:auto;background:#f9fafb;border:1px solid #e5e7eb;padding:10px;margin:10px 0}
.chatMessage{padding:8px;margin:6px 0;background:#e5e7eb;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="logo">Zrides Driver</div>
  <div class="row" style="flex:0;align-items:center">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 id="heading">Driver Dashboard</h2>
    <p id="intro" class="muted">Register your vehicle and wait for approval.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </div>

  <div class="card" id="registrationCard">
    <h2 id="registrationHeading">Driver Registration</h2>
    <form id="registrationForm">
      <div class="field">
        <label id="nameLabel" for="name">Full Name</label>
        <input id="name" maxlength="80" required>
      </div>
      <div class="field">
        <label id="phoneLabel" for="phone">Phone Number</label>
        <input id="phone" type="tel" maxlength="25" required>
      </div>
      <div class="field">
        <label id="vehicleLabel" for="vehicle">Vehicle Type</label>
        <select id="vehicle">
          <option value="bike">Bike</option>
          <option value="car">Car</option>
          <option value="rickshaw">Rickshaw</option>
        </select>
      </div>
      <div class="field">
        <label id="plateLabel" for="plate">Vehicle Registration Number</label>
        <input id="plate" maxlength="30" required>
      </div>
      <button id="registerBtn" type="submit">Submit Registration</button>
    </form>
  </div>

  <div class="card">
    <h2 id="approvalHeading">Approval Status</h2>
    <p id="approvalStatus" class="muted">Loading status...</p>
  </div>

  <div class="card">
    <h2 id="queueHeading">Available Rides</h2>
    <div id="queue"><p class="muted">Loading rides...</p></div>
  </div>

  <div class="card">
    <h2 id="activeHeading">My Assigned Rides</h2>
    <div id="activeRides"><p class="muted">Loading rides...</p></div>
  </div>

  <div class="card hidden" id="chatCard">
    <h2 id="chatHeading">Ride Chat</h2>
    <div id="chatMessages" class="chatMessages"></div>
    <form id="chatForm">
      <div class="row">
        <input id="chatInput" maxlength="1000" required>
        <button id="sendBtn" type="submit">Send</button>
      </div>
    </form>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
"use strict";

const firebaseConfig={
  apiKey:"AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
  authDomain:"zrides-9f2da.firebaseapp.com",
  databaseURL:"https://zrides-9f2da-default-rtdb.firebaseio.com",
  projectId:"zrides-9f2da",
  storageBucket:"zrides-9f2da.firebasestorage.app",
  messagingSenderId:"93898388224",
  appId:"1:93898388224:web:2e4f78e5b31dec26f839e5"
};

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);

const words={
 en:{
  heading:"Driver Dashboard",intro:"Register your vehicle and wait for approval.",
  registration:"Driver Registration",name:"Full Name",phone:"Phone Number",
  vehicle:"Vehicle Type",plate:"Vehicle Registration Number",
  register:"Submit Registration",approval:"Approval Status",
  queue:"Available Rides",active:"My Assigned Rides",chat:"Ride Chat",
  send:"Send",logout:"Logout",loading:"Loading...",
  pendingApproval:"Your application is waiting for admin approval.",
  approved:"Your driver account is approved.",
  rejected:"Your application was rejected. Contact support.",
  submit:"Registration submitted. Wait for admin approval.",
  registerError:"Unable to submit registration.",
  noRides:"No rides are available right now.",
  noActive:"You have no assigned rides.",
  accept:"Accept Ride",pickup:"Pickup",dropoff:"Destination",
  service:"Vehicle",fare:"Fare",status:"Status",
  accepted:"Accepted",arrived:"Driver Arrived",started:"Start Ride",
  complete:"Complete Ride",pending:"Pending",completed:"Completed",
  cancelled:"Cancelled",acceptedSuccess:"Ride accepted.",
  acceptError:"Unable to accept this ride. It may have been taken.",
  updateError:"Unable to update ride status.",
  chatOpen:"Chat with Customer",chatError:"Unable to load chat.",
  message:"Type your message",sendError:"Unable to send message.",
  nameRequired:"Enter your name.",phoneRequired:"Enter your phone number.",
  plateRequired:"Enter the vehicle registration number.",
  verify:"Verify your email before using the driver portal.",
  profileError:"Driver profile could not be verified.",
  noRegistration:"Complete driver registration first.",
  queueError:"Unable to load rides. Check database permissions.",
  unauthorized:"This account is not registered as a driver.",
  bike:"Bike",car:"Car",rickshaw:"Rickshaw",notAssigned:"Not assigned"
 },
 ur:{
  heading:"Driver Dashboard",intro:"Vehicle register karein aur admin approval ka intezar karein.",
  registration:"Driver Registration",name:"Poora Naam",phone:"Phone Number",
  vehicle:"Vehicle ki Qisam",plate:"Vehicle Registration Number",
  register:"Registration Jama Karein",approval:"Approval Status",
  queue:"Available Rides",active:"Meri Assigned Rides",chat:"Ride Chat",
  send:"Bhejein",logout:"Logout",loading:"Load ho raha hai...",
  pendingApproval:"Aapki application admin approval ki muntazir hai.",
  approved:"Aapka driver account approve ho gaya hai.",
  rejected:"Application reject hui. Support se rabta karein.",
  submit:"Registration jama ho gayi. Admin approval ka intezar karein.",
  registerError:"Registration jama nahi ho saki.",
  noRides:"Filhaal koi ride available nahi.",
  noActive:"Aapko koi ride assign nahi hui.",
  accept:"Ride Accept Karein",pickup:"Pickup",dropoff:"Manzil",
  service:"Vehicle",fare:"Kiraya",status:"Status",
  accepted:"Accept ho gayi",arrived:"Driver Pohanch Gaya",started:"Ride Shuru Karein",
  complete:"Ride Mukammal Karein",pending:"Pending",completed:"Mukammal",
  cancelled:"Cancel",acceptedSuccess:"Ride accept ho gayi.",
  acceptError:"Ride accept nahi hui. Mumkin hai kisi aur driver ne le li ho.",
  updateError:"Ride status update nahi ho saka.",
  chatOpen:"Customer se Chat",chatError:"Chat load nahi hui.",
  message:"Message likhein",sendError:"Message nahi bheja ja saka.",
  nameRequired:"Apna naam likhein.",phoneRequired:"Phone number likhein.",
  plateRequired:"Vehicle registration number likhein.",
  verify:"Driver portal se pehle email verify karein.",
  profileError:"Driver profile verify nahi ho saki.",
  noRegistration:"Pehle driver registration mukammal karein.",
  queueError:"Rides load nahi hui. Database permissions check karein.",
  unauthorized:"Yeh account driver ke taur par registered nahi.",
  bike:"Bike",car:"Car",rickshaw:"Rickshaw",notAssigned:"Abhi assign nahi"
 }
};

let lang=localStorage.getItem("zridesLanguage")||"en";
let user=null,driver=null,queueRef=null,chatRef=null,activeChatOrder=null;
let ordersCache={};

function t(k){return words[lang][k]||words.en[k]||k;}
function msg(text,type="info"){
  $("message").textContent=text;
  $("message").className="message "+type;
}
function applyLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  $("language").value=lang;
  const map={
   heading:"heading",intro:"intro",registrationHeading:"registration",
   nameLabel:"name",phoneLabel:"phone",vehicleLabel:"vehicle",
   plateLabel:"plate",registerBtn:"register",approvalHeading:"approval",
   queueHeading:"queue",activeHeading:"active",chatHeading:"chat",
   sendBtn:"send",logoutBtn:"logout"
  };
  Object.entries(map).forEach(([id,key])=>$(id).textContent=t(key));
  [...$("vehicle").options].forEach(o=>o.textContent=t(o.value));
  $("chatInput").placeholder=t("message");
  renderQueue();
  renderActive();
}
$("language").onchange=e=>{
 lang=e.target.value;
 localStorage.setItem("zridesLanguage",lang);
 applyLanguage();
};

function makeText(tag,text){
 const el=document.createElement(tag);
 el.textContent=String(text??"");
 return el;
}

function renderQueue(){
 const box=$("queue");
 if(!driver||driver.approvalStatus!=="approved"||!driver.uid){
  box.replaceChildren(makeText("p",t("pendingApproval")));
  return;
 }
 box.replaceChildren();

 db.ref("rideQueue").orderByChild("status").equalTo("pending").once("value")
 .then(snap=>{
  box.replaceChildren();
  let count=0;
  snap.forEach(child=>{
   const ride={id:child.key,...child.val()};
   if(!ride.orderId)return;
   count++;

   const card=document.createElement("div");
   card.className="ride";
   card.appendChild(makeText("h3",ride.pickup+" → "+ride.dropoff));
   card.appendChild(makeText("p",t("service")+": "+t(ride.service||"bike")));
   card.appendChild(makeText("p",t("fare")+": "+(ride.fare??"—")));

   const btn=makeText("button",t("accept"));
   btn.onclick=()=>acceptRide(ride.orderId);
   card.appendChild(btn);
   box.appendChild(card);
  });
  if(!count)box.appendChild(makeText("p",t("noRides")));
 })
 .catch(error=>{
  console.error(error);
  msg(t("queueError"),"error");
 });
}

async function acceptRide(orderId){
 if(!driver||driver.approvalStatus!=="approved")return;

 try{
  const result=await db.ref("orders/"+orderId).transaction(order=>{
   if(!order||order.status!=="pending"||order.driverUid)return;
   order.driverUid=user.uid;
   order.driverName=driver.name;
   order.status="accepted";
   order.updatedAt=firebase.database.ServerValue.TIMESTAMP;
   return order;
  });

  if(!result.committed){
   msg(t("acceptError"),"error");
   return;
  }

  await db.ref("rideQueue/"+orderId).update({
   status:"accepted",
   driverUid:user.uid,
   updatedAt:firebase.database.ServerValue.TIMESTAMP
  });

  msg(t("acceptedSuccess"),"success");
  loadActive();
  renderQueue();
 }catch(error){
  console.error(error);
  msg(t("acceptError"),"error");
 }
}

function loadActive(){
 if(!user)return;

 db.ref("orders").orderByChild("driverUid").equalTo(user.uid).on("value",snap=>{
  ordersCache={};
  snap.forEach(child=>ordersCache[child.key]={id:child.key,...child.val()});
  renderActive();
 },error=>{
  console.error(error);
  msg(t("queueError"),"error");
 });
}

function renderActive(){
 const box=$("activeRides");
 if(!driver){box.replaceChildren(makeText("p",t("loading")));return;}
 box.replaceChildren();

 const list=Object.values(ordersCache);
 if(!list.length){
  box.appendChild(makeText("p",t("noActive")));
  return;
 }

 list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

 list.forEach(ride=>{
  const card=document.createElement("div");
  card.className="ride";
  card.appendChild(makeText("h3",ride.pickup+" → "+ride.dropoff));
  card.appendChild(makeText("p",t("status")+": "+ride.status));
  card.appendChild(makeText("p",t("fare")+": "+(ride.fare??"—")));

  const row=document.createElement("div");
  row.className="row";

  if(ride.status==="accepted"){
   const arrived=makeText("button",t("arrived"));
   arrived.onclick=()=>updateStatus(ride.id,"arrived");
   row.appendChild(arrived);
  }

  if(ride.status==="arrived"){
   const start=makeText("button",t("started"));
   start.onclick=()=>updateStatus(ride.id,"started");
   row.appendChild(start);
  }

  if(ride.status==="started"){
   const complete=makeText("button",t("complete"));
   complete.onclick=()=>updateStatus(ride.id,"completed");
   row.appendChild(complete);
  }

  if(!["completed","cancelled"].includes(ride.status)){
   const chat=makeText("button",t("chatOpen"));
   chat.onclick=()=>openChat(ride.id);
   row.appendChild(chat);
  }

  card.appendChild(row);
  box.appendChild(card);
 });
}

async function updateStatus(orderId,newStatus){
 const allowed={accepted:"arrived",arrived:"started",started:"completed"};

 try{
  const result=await db.ref("orders/"+orderId).transaction(order=>{
   if(!order||order.driverUid!==user.uid)return;
   if(allowed[order.status]!==newStatus)return;
   order.status=newStatus;
   order.updatedAt=firebase.database.ServerValue.TIMESTAMP;
   return order;
  });

  if(!result.committed){
   msg(t("updateError"),"error");
   return;
  }

  await db.ref("rideQueue/"+orderId).update({
   status:newStatus,
   updatedAt:firebase.database.ServerValue.TIMESTAMP
  });

  loadActive();
  renderQueue();
 }catch(error){
  console.error(error);
  msg(t("updateError"),"error");
 }
}

function openChat(orderId){
 if(chatRef)chatRef.off();
 activeChatOrder=orderId;
 $("chatCard").classList.remove("hidden");

 chatRef=db.ref("chats/"+orderId+"/messages").limitToLast(100);
 chatRef.on("value",snap=>{
  const box=$("chatMessages");
  box.replaceChildren();
  snap.forEach(child=>{
   const item=child.val()||{};
   const div=document.createElement("div");
   div.className="chatMessage";
   div.appendChild(makeText("strong",
    item.senderUid===user.uid?"You":(item.senderName||"Customer")));
   div.appendChild(makeText("div",item.text||""));
   box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
 },error=>{
  console.error(error);
  msg(t("chatError"),"error");
 });
}

$("chatForm").onsubmit=async e=>{
 e.preventDefault();
 const text=$("chatInput").value.trim();
 if(!text||!activeChatOrder)return;

 try{
  const snap=await db.ref("orders/"+activeChatOrder).once("value");
  const order=snap.val();
  if(!order||order.driverUid!==user.uid)throw new Error("Not assigned");

  await db.ref("chats/"+activeChatOrder+"/messages").push().set({
   senderUid:user.uid,
   senderName:driver.name||"Driver",
   text:text,
   createdAt:firebase.database.ServerValue.TIMESTAMP
  });
  $("chatInput").value="";
 }catch(error){
  console.error(error);
  msg(t("sendError"),"error");
 }
};

$("registrationForm").onsubmit=async e=>{
 e.preventDefault();
 if(!user||!user.emailVerified){
  msg(t("verify"),"error");
  return;
 }

 const name=$("name").value.trim();
 const phone=$("phone").value.trim();
 const vehicle=$("vehicle").value;
 const plate=$("plate").value.trim();

 if(name.length<2){msg(t("nameRequired"),"error");return;}
 if(!phone){msg(t("phoneRequired"),"error");return;}
 if(!plate){msg(t("plateRequired"),"error");return;}

 $("registerBtn").disabled=true;

 try{
  const profileSnap=await db.ref("users/"+user.uid).once("value");
  const profile=profileSnap.val();

  if(!profile||profile.uid!==user.uid||profile.role!=="driver"){
   throw new Error(t("unauthorized"));
  }

  const driverRef=db.ref("drivers/"+user.uid);
  const existing=await driverRef.once("value");
  const old=existing.val()||{};

  const data={
   uid:user.uid,
   name:name,
   email:user.email,
   phone:phone,
   vehicle:vehicle,
   plate:plate,
   approvalStatus:old.approvalStatus==="approved"?"approved":
                  old.approvalStatus==="rejected"?"rejected":"pending",
   walletBalance:Number(old.walletBalance)||0,
   createdAt:old.createdAt||Date.now(),
   updatedAt:firebase.database.ServerValue.TIMESTAMP
  };

  await driverRef.set(data);
  driver=data;
  $("registrationCard").classList.add("hidden");
  $("approvalStatus").textContent=
    driver.approvalStatus==="approved"?t("approved"):
    driver.approvalStatus==="rejected"?t("rejected"):t("pendingApproval");
  msg(t("submit"),"success");
  renderQueue();
  loadActive();

 }catch(error){
  console.error(error);
  msg(error.message||t("registerError"),"error");
 }finally{
  $("registerBtn").disabled=false;
 }
};

$("logoutBtn").onclick=async()=>{
 if(queueRef)queueRef.off();
 if(chatRef)chatRef.off();
 await auth.signOut();
 location.replace("login.html");
};

auth.onAuthStateChanged(async current=>{
 if(!current){location.replace("login.html");return;}
 user=current;

 try{
  await current.reload();
  user=auth.currentUser;

  if(!user.emailVerified){
   msg(t("verify"),"error");
   return;
  }

  const profileSnap=await db.ref("users/"+user.uid).once("value");
  const profile=profileSnap.val();

  if(!profile||profile.uid!==user.uid||profile.role!=="driver"){
   msg(t("unauthorized"),"error");
   return;
  }

  const driverRef=db.ref("drivers/"+user.uid);
  driverRef.on("value",snap=>{
   driver=snap.val();

   if(!driver){
    $("registrationCard").classList.remove("hidden");
    $("approvalStatus").textContent=t("noRegistration");
    $("queue").replaceChildren(makeText("p",t("noRegistration")));
    return;
   }

   $("registrationCard").classList.add("hidden");

   $("approvalStatus").textContent=
    driver.approvalStatus==="approved"?t("approved"):
    driver.approvalStatus==="rejected"?t("rejected"):t("pendingApproval");

   renderQueue();
  },error=>{
   console.error(error);
   msg(t("profileError"),"error");
  });

  loadActive();
 }catch(error){
  console.error(error);
  msg(t("profileError"),"error");
 }
});

applyLanguage();
</script>
</body>
    </html>
