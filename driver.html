<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides - Driver Portal</title>
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 30px; }
        
        header { background-color: #0f172a; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #10b981; }
        
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

        .btn { background: #10b981; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn:hover { background: #059669; }
        .btn-secondary { background: #3b82f6; margin-top: 5px; }

        .order-card { background: #fff; border: 1px solid #cbd5e1; border-left: 5px solid #10b981; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .order-details { font-size: 14px; color: #475569; line-height: 1.6; margin-bottom: 10px; }

        .bid-box { display: flex; gap: 10px; margin-top: 10px; }
        .bid-box input { width: 60%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }

        #map { height: 350px; border-radius: 8px; margin-bottom: 15px; }
        .status-badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }

        .notification-box { background: #3b82f6; color: white; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; display: none; }

        /* Chat Box */
        .chat-container { border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; height: 250px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 80%; }
        .chat-msg.driver { background: #10b981; color: white; align-self: flex-start; }
        .chat-msg.customer { background: #e2e8f0; color: #1e293b; align-self: flex-end; }
        .chat-input { display: flex; padding: 8px; border-top: 1px solid #cbd5e1; background: white; }
        .chat-input input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; margin-left: 8px; }
        .chat-input button { padding: 8px 15px; width: auto; }

        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zrides Driver</div>
        <div id="driverStatus" class="status-badge">Not Registered</div>
    </header>

    <div class="container">
        <!-- Driver Registration Form -->
        <div class="card" id="regCard">
            <h2>🚗 Driver Profile & Documents Verification</h2>
            <form id="driverRegForm">
                <div class="form-group">
                    <label>Poora Naam (Full Name):</label>
                    <input type="text" id="dName" required placeholder="Ali Ahmed">
                </div>
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="tel" id="dPhone" required placeholder="03001234567">
                </div>
                <div class="form-group">
                    <label>Gari Ki Kism (Vehicle Type):</label>
                    <select id="dVehicle">
                        <option value="Bike">🏍️ Bike</option>
                        <option value="Rickshaw">🛺 Rickshaw</option>
                        <option value="Car Mini">🚗 Car Mini</option>
                        <option value="Car Sedan">🚘 Car Sedan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Gari Ka Number (Vehicle Number):</label>
                    <input type="text" id="dPlate" required placeholder="LEA-1234">
                </div>
                <button type="submit" class="btn">Register & Start Earning</button>
            </form>
        </div>

        <!-- Active Trip & Map Section -->
        <div class="card" id="tripCard" style="display: none;">
            <div id="driverNotification" class="notification-box">🔔 Customer Updates</div>

            <h2>📍 Live Ride Management</h2>
            <div id="map"></div>

            <div id="tripControls" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="btnConfirmRide" class="btn" style="display: none;" onclick="confirmRideByDriver()">✅ Confirm & Accept Ride</button>
                <button id="btnArrived" class="btn btn-secondary" style="display: none;" onclick="markArrived()">📍 Arrived at Pickup</button>
                <button id="btnStart" class="btn" style="display: none;" onclick="startJourney()">🚀 Start Journey</button>
            </div>

            <!-- In-App Chat -->
            <h2>💬 Chat with Customer</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chatMsgs"></div>
                <div class="chat-input">
                    <input type="text" id="chatText" placeholder="Message likhein...">
                    <button class="btn" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>

        <!-- Available Orders Section -->
        <div class="card" id="ordersCard" style="display: none;">
            <h2>📦 Available Rides / Orders</h2>
            <div id="ordersList">Searching for nearby rides...</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
            authDomain: "zrides-9f2da.firebaseapp.com",
            databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
            projectId: "zrides-9f2da",
            storageBucket: "zrides-9f2da.firebasestorage.app",
            messagingSenderId: "93898388224",
            appId: "1:93898388224:web:2e4f78e5b31dec26f839e5",
            measurementId: "G-XCGVR3L9YV"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeOrderId = null;
        let driverData = null;
        let map, driverMarker;

        document.getElementById('driverRegForm').addEventListener('submit', function(e) {
            e.preventDefault();
            driverData = {
                name: document.getElementById('dName').value,
                phone: document.getElementById('dPhone').value,
                vehicle: document.getElementById('dVehicle').value,
                plate: document.getElementById('dPlate').value,
                status: 'online'
            };
            
            document.getElementById('regCard').style.display = 'none';
            document.getElementById('ordersCard').style.display = 'block';
            document.getElementById('driverStatus').innerText = "Online (" + driverData.vehicle + ")";
            document.getElementById('driverStatus').style.background = "#dcfce7";
            document.getElementById('driverStatus').style.color = "#15803d";

            listenForOrders();
        });

        function listenForOrders() {
            db.ref('orders').on('value', snapshot => {
                const ordersList = document.getElementById('ordersList');
                ordersList.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    ordersList.innerHTML = '<p style="text-align:center; color:#64748b;">Filhal koi order available nahi hai.</p>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    const order = data[key];
                    if (order.status === 'pending' || order.status === 'customer_counter_offer') {
                        const div = document.createElement('div');
                        div.className = 'order-card';
                        div.innerHTML = `
                            <div class="order-header">
                                <span>${order.service}</span>
                                <span style="color:#10b981;">Fare: ${order.offeredFare || order.fare}</span>
                            </div>
                            <div class="order-details">
                                <strong>Pickup:</strong> ${order.pickup}<br>
                                <strong>Dropoff:</strong> ${order.dropoff}<br>
                                <strong>Distance:</strong> ${order.distance || 'N/A'}<br>
                                <strong>Phone:</strong> ${order.phone}
                            </div>
                            <div class="bid-box">
                                <input type="number" id="bid_${key}" value="${parseInt((order.offeredFare || order.fare).replace('Rs. ','')) || 100}">
                                <button class="btn" onclick="sendCounterOffer('${key}')">Send Counter Offer</button>
                            </div>
                        `;
                        ordersList.appendChild(div);
                    }
                });
            });
        }

        // Send Driver Counter Offer
        function sendCounterOffer(orderId) {
            const newFare = document.getElementById(`bid_${orderId}`).value;
            db.ref(`orders/${orderId}`).update({
                offeredFare: "Rs. " + newFare,
                status: 'driver_counter_offer',
                driverPhone: driverData.phone,
                driverName: driverData.name
            });
            
            activeOrderId = orderId;
            startTripView(orderId);
        }

        function startTripView(orderId) {
            document.getElementById('ordersCard').style.display = 'none';
            document.getElementById('tripCard').style.display = 'block';

            if (!map) {
                map = L.map('map').setView([31.5204, 74.3587], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            }

            // Realtime Status Listener for Driver Side
            db.ref(`orders/${orderId}`).on('value', snapshot => {
                const order = snapshot.val();
                if(!order) return;

                const driverNotif = document.getElementById('driverNotification');

                // Customer Accepted Offer -> Show Confirm Button to Driver
                if(order.status === 'accepted_by_customer') {
                    driverNotif.style.display = 'block';
                    driverNotif.innerText = `🎉 Customer ne Fare (${order.fare}) accept kar liya hai! Click Confirm to Start.`;
                    document.getElementById('btnConfirmRide').style.display = 'block';
                }

                if(order.status === 'confirmed_by_driver') {
                    document.getElementById('btnConfirmRide').style.display = 'none';
                    document.getElementById('btnArrived').style.display = 'block';
                    driverNotif.innerText = "🚕 Ride Confirmed! Pickup location par pahunch kar 'Arrived' dabayein.";
                }

                if(order.status === 'arrived') {
                    document.getElementById('btnArrived').style.display = 'none';
                    document.getElementById('btnStart').style.display = 'block';
                }
            });

            // Chat Listener
            db.ref(`chats/${orderId}`).on('child_added', snapshot => {
                const msg = snapshot.val();
                const chatMsgs = document.getElementById('chatMsgs');
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat-msg ${msg.sender}`;
                msgDiv.innerText = `${msg.sender === 'driver' ? 'Aap' : 'Customer'}: ${msg.text}`;
                chatMsgs.appendChild(msgDiv);
                chatMsgs.scrollTop = chatMsgs.scrollHeight;
            });
        }

        // Final Acceptance by Driver
        function confirmRideByDriver() {
            db.ref(`orders/${activeOrderId}`).update({
                status: 'confirmed_by_driver'
            });
            alert("Ride Confirmed! Customer ko notification bhej di gayi hai.");
        }

        function markArrived() {
            db.ref(`orders/${activeOrderId}`).update({
                status: 'arrived'
            });
            alert("Customer ko Pickup Arrival Notification bhej di gayi hai.");
        }

        function startJourney() {
            db.ref(`orders/${activeOrderId}`).update({
                status: 'in_progress'
            });

            alert("Journey Started! Live Location Tracking chalu hai.");

            if (navigator.geolocation) {
                setInterval(() => {
                    navigator.geolocation.getCurrentPosition(pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;

                        if (driverMarker) map.removeLayer(driverMarker);
                        driverMarker = L.marker([lat, lng]).addTo(map).bindPopup("🚗 Live Position").openPopup();
                        map.panTo([lat, lng]);

                        db.ref(`orders/${activeOrderId}/driverLocation`).set({ lat, lng });
                    });
                }, 5000);
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatText');
            if (input.value.trim() !== '') {
                db.ref(`chats/${activeOrderId}`).push({
                    sender: 'driver',
                    text: input.value,
                    time: new Date().toLocaleTimeString()
                });
                input.value = '';
            }
        }
    </script>
</body>
</html>
