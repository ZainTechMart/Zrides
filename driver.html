<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides Partner Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        header { background-color: #1e293b; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: bold; color: #10b981; }
        .btn-nav { background: #10b981; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }

        .dashboard { max-width: 1200px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }

        .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        .card h2 { color: #10b981; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }

        .order-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-right: 4px solid #10b981; }
        .order-title { background: #10b981; color: white; font-size: 12px; padding: 3px 8px; border-radius: 4px; font-weight: bold; display: inline-block; }
        .order-details { margin: 10px 0; font-size: 14px; line-height: 1.6; color: #cbd5e1; }

        .bidding-box { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .bidding-box input { width: 100px; padding: 8px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; text-align: center; }

        .btn-accept { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-offer { background: #38bdf8; color: #0f172a; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

        #driverMap { height: 420px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zrides Partner Portal 🏍️</div>
        <a href="index.html" class="btn-nav">کسٹمر سائٹ</a>
    </header>

    <div class="dashboard">
        <div class="card">
            <h2>لائیو سواریاں (Live Requests)</h2>
            <div id="ordersContainer">
                <p style="text-align: center; color: #94a3b8; padding: 20px;">کوئی نیا آرڈر موجود نہیں ہے۔</p>
            </div>
        </div>

        <div class="card" style="padding: 10px;">
            <div id="driverMap"></div>
        </div>
    </div>

    <!-- Leaflet & Firebase SDKs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
            authDomain: "zrides-9f2da.firebaseapp.com",
            databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
            projectId: "zrides-9f2da",
            storageBucket: "zrides-9f2da.firebasestorage.app",
            messagingSenderId: "93898388224",
            appId: "1:93898388224:web:2e4f78e5b31dec26f839e5",
            measurementId: "G-XCGVR3L9YV"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        var map = L.map('driverMap').setView([31.5204, 74.3587], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        db.ref('orders/').on('value', function(snapshot) {
            var container = document.getElementById('ordersContainer');
            container.innerHTML = "";
            var data = snapshot.val();

            if (!data) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">کوئی نیا آرڈر موجود نہیں ہے۔</p>';
                return;
            }

            Object.keys(data).forEach(function(key) {
                var order = data[key];
                if (order.status === 'pending') {
                    var numericFare = parseInt(order.fare.replace(/[^0-9]/g, '')) || 150;
                    
                    var cardHTML = `
                        <div class="order-card" id="card-${key}">
                            <span class="order-title">${order.service}</span>
                            <div class="order-details">
                                <p><strong>پک اپ:</strong> ${order.pickup}</p>
                                <p><strong>ڈراپ:</strong> ${order.dropoff}</p>
                                <p><strong>فاصلہ:</strong> ${order.distance} کلومیٹر</p>
                                <p><strong>کسٹمر فون:</strong> ${order.phone}</p>
                                <p><strong>کسٹمر کی پیشکش:</strong> <span style="color:#10b981; font-weight:bold;">${order.fare}</span></p>
                            </div>

                            <div class="bidding-box">
                                <input type="number" id="offer-${key}" value="${numericFare}">
                                <button class="btn-offer" onclick="sendCounterOffer('${key}')">آفر بھیجیں</button>
                                <button class="btn-accept" onclick="acceptOrder('${key}')">قبول کریں</button>
                                <button class="btn-reject" onclick="rejectOrder('${key}')">رد کریں</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                }
            });
        });

        function acceptOrder(key) {
            db.ref('orders/' + key).update({ status: 'accepted' });
            alert("آپ نے یہ آرڈر قبول کر لیا ہے!");
        }

        function sendCounterOffer(key) {
            var newFare = document.getElementById('offer-' + key).value;
            db.ref('orders/' + key).update({ offeredFare: "Rs. " + newFare, status: 'counter_offered' });
            alert("کسٹمر کو Rs. " + newFare + " کی نیا کرایہ آفر بھیج دی گئی ہے۔");
        }

        function rejectOrder(key) {
            db.ref('orders/' + key).update({ status: 'rejected' });
        }
    </script>
</body>
</html>
