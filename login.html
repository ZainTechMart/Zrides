<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides - لاگ ان / سائن اپ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .auth-card h2 { text-align: center; margin-bottom: 20px; color: #10b981; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; font-size: 15px; }
        .btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #059669; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #38bdf8; cursor: pointer; }
        .back-home { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="formTitle">Zrides اکاؤنٹ لاگ ان</h2>
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display:none;">
                <label>پورا نام (Full Name):</label>
                <input type="text" id="fullName" placeholder="علی خان">
            </div>
            <div class="form-group">
                <label>ای میل ایڈریس (Email Address):</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>پاس ورڈ (Password):</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" class="btn" id="submitBtn">لاگ ان کریں</button>
        </form>
        <div class="toggle-link" onclick="toggleAuthMode()" id="toggleText">نیا اکاؤنٹ بنائیں؟ سائن اپ کریں</div>
        <a href="index.html" class="back-home">← ہوم پیج پر واپس جائیں</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
            authDomain: "zrides-9f2da.firebaseapp.com",
            databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
            projectId: "zrides-9f2da",
            storageBucket: "zrides-9f2da.firebasestorage.app",
            messagingSenderId: "93898388224",
            appId: "1:93898388224:web:2e4f78e5b31dec26f839e5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isSignup = false;

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('formTitle').innerText = isSignup ? "نیا محفوظ اکاؤنٹ بنائیں" : "Zrides اکاؤنٹ لاگ ان";
            document.getElementById('submitBtn').innerText = isSignup ? "اکاؤنٹ بنائیں اور تصدیق کریں" : "لاگ ان کریں";
            document.getElementById('nameGroup').style.display = isSignup ? "block" : "none";
            document.getElementById('toggleText').innerText = isSignup ? "پہلے سے اکاؤنٹ موجود ہے؟ لاگ ان کریں" : "نیا اکاؤنٹ بنائیں؟ سائن اپ کریں";
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (isSignup) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        userCredential.user.sendEmailVerification().then(() => {
                            alert("اکاؤنٹ بن گیا ہے! آپ کی ای میل پر تصدیقی لنک بھیج دیا گیا ہے۔ ای میل کنفرم کر کے لاگ ان کریں۔");
                            toggleAuthMode();
                        });
                    })
                    .catch(error => alert("رجسٹریشن کی خرابی: " + error.message));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        if (userCredential.user.emailVerified) {
                            alert("لاگ ان کامیاب ہو گیا!");
                            window.location.href = "index.html";
                        } else {
                            alert("پہلے اپنی ای میل ان بکس چیک کر کے تصدیق (Verify) کریں۔");
                            auth.signOut();
                        }
                    })
                    .catch(error => alert("لاگ ان ناکام: " + error.message));
            }
        });
    </script>
</body>
</html>
