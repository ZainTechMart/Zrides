<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Zrides | Login & Signup</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:440px;background:white;padding:25px;border-radius:18px;box-shadow:0 8px 30px #0001}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:29px;font-weight:800;color:#16a34a}
select,input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;background:white}
label{display:block;margin-bottom:7px;font-weight:bold;font-size:14px}
.field{margin-bottom:16px}
button{cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#e5e7eb;font-weight:bold}
.tabs .active{background:#16a34a;color:white}
.primary{width:100%;padding:14px;background:#16a34a;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
.secondary{width:100%;padding:12px;border:0;background:transparent;color:#15803d;font-weight:bold}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:15px;line-height:1.5;overflow-wrap:anywhere}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
.hidden{display:none!important}
.lang{width:auto;padding:8px;border-radius:8px}
.small{text-align:center;color:#6b7280;font-size:13px;line-height:1.6;margin-top:18px}
</style>
</head>

<body>
<main class="card">

  <div class="top">
    <div class="logo">Zrides</div>
    <select id="language" class="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
  </div>

  <h2 id="heading">Welcome to Zrides</h2>
  <p id="subtitle" style="margin:8px 0 22px;color:#6b7280">
    Login or create your account.
  </p>

  <div class="tabs">
    <button type="button" id="loginTab" class="active">Login</button>
    <button type="button" id="signupTab">Sign Up</button>
  </div>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <form id="authForm">

    <div id="nameField" class="field hidden">
      <label id="nameLabel" for="name">Full Name</label>
      <input id="name" maxlength="80" autocomplete="name">
    </div>

    <div class="field">
      <label id="emailLabel" for="email">Email Address</label>
      <input id="email" type="email" maxlength="254"
             autocomplete="email" required>
    </div>

    <div class="field">
      <label id="passwordLabel" for="password">Password</label>
      <input id="password" type="password" minlength="6"
             autocomplete="current-password" required>
    </div>

    <div id="roleField" class="field hidden">
      <label id="roleLabel" for="role">Account Type</label>
      <select id="role">
        <option value="customer" id="customerOption">Customer</option>
        <option value="driver" id="driverOption">Driver</option>
      </select>
    </div>

    <button class="primary" id="submitBtn" type="submit">Login</button>
  </form>

  <button id="resetBtn" class="secondary" type="button">
    Forgot Password?
  </button>

  <button id="resendBtn" class="secondary hidden" type="button">
    Resend Verification Email
  </button>

  <button id="logoutBtn" class="secondary hidden" type="button">
    Logout
  </button>

  <p class="small" id="footerText">
    Your account and personal information should be protected.
  </p>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
  authDomain: "zrides-9f2da.firebaseapp.com",
  databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
  projectId: "zrides-9f2da",
  storageBucket: "zrides-9f2da.firebasestorage.app",
  messagingSenderId: "93898388224",
  appId: "1:93898388224:web:2e4f78e5b31dec26f839e5"
};

const ADMIN_UID = "cmmo7x7k0CY8lkcev4Rq92t84wU2";

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);

const translations = {
  en: {
    heading:"Welcome to Zrides",
    subtitle:"Login or create your account.",
    login:"Login", signup:"Sign Up",
    name:"Full Name", email:"Email Address",
    password:"Password", role:"Account Type",
    customer:"Customer", driver:"Driver",
    forgot:"Forgot Password?",
    resend:"Resend Verification Email",
    logout:"Logout",
    footer:"Your account and personal information should be protected.",
    create:"Create Account", wait:"Please wait...",
    enterName:"Please enter your full name.",
    shortName:"Your name must contain at least 2 characters.",
    chooseRole:"Please select a valid account type.",
    verify:"Please verify your email before accessing Zrides.",
    verificationSent:"Verification email sent. Check your inbox and spam folder.",
    accountCreated:"Account created. Verify your email, then log in.",
    resetSent:"If an account exists for this email, a reset email will be sent.",
    loginError:"Email or password is incorrect.",
    network:"Network error. Check your internet connection.",
    profileError:"Unable to load your profile. Please try again.",
    invalidRole:"Your account role is not valid. Contact support.",
    resetFirst:"Enter your email address first.",
    resetError:"Unable to send the reset email. Please try again.",
    resendError:"Unable to send verification email. Please try again.",
    logoutError:"Unable to log out. Please try again.",
    permission:"Database permission denied. Rules need to be configured correctly.",
    verified:"Your email is already verified. Please log in again.",
    session:"Unable to verify your session. Please log in again."
  },
  ur: {
    heading:"Zrides mein khush aamdeed",
    subtitle:"Login karein ya naya account banayein.",
    login:"Login", signup:"Account Banayein",
    name:"Poora Naam", email:"Email Address",
    password:"Password", role:"Account ki Qisam",
    customer:"Customer", driver:"Driver",
    forgot:"Password Bhool Gaye?",
    resend:"Verification Email Dobara Bhejein",
    logout:"Logout",
    footer:"Apne account aur zaati maloomat ki hifazat karein.",
    create:"Account Banayein", wait:"Barah-e-karam intezar karein...",
    enterName:"Apna poora naam likhein.",
    shortName:"Naam kam az kam 2 haroof ka hona chahiye.",
    chooseRole:"Sahi account type select karein.",
    verify:"Zrides istemal karne se pehle email verify karein.",
    verificationSent:"Verification email bhej di gayi hai. Inbox aur Spam check karein.",
    accountCreated:"Account ban gaya. Email verify karke login karein.",
    resetSent:"Agar is email par account hai to reset email bhej di jayegi.",
    loginError:"Email ya password ghalat hai.",
    network:"Internet connection check karein.",
    profileError:"Profile load nahi ho saki. Dobara koshish karein.",
    invalidRole:"Account role durust nahi. Support se rabta karein.",
    resetFirst:"Pehle apna email address likhein.",
    resetError:"Reset email nahi bheji ja saki. Dobara koshish karein.",
    resendError:"Verification email nahi bheji ja saki.",
    logoutError:"Logout nahi ho saka. Dobara koshish karein.",
    permission:"Database permission nahi mili. Rules check karne honge.",
    verified:"Email pehle hi verify hai. Dobara login karein.",
    session:"Session verify nahi ho saka. Dobara login karein."
  }
};

let language = localStorage.getItem("zridesLanguage") || "en";
let mode = "login";
let busy = false;

function t(key) {
  return translations[language][key] || translations.en[key] || key;
}

function say(text, type="info") {
  $("message").textContent = text;
  $("message").className = "message " + type;
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "message";
}

function applyLanguage() {
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ur" ? "rtl" : "ltr";
  $("language").value = language;

  [
    ["heading","heading"],["subtitle","subtitle"],
    ["nameLabel","name"],["emailLabel","email"],
    ["passwordLabel","password"],["roleLabel","role"],
    ["customerOption","customer"],["driverOption","driver"],
    ["resetBtn","forgot"],["resendBtn","resend"],
    ["logoutBtn","logout"],["footerText","footer"]
  ].forEach(([id,key]) => $(id).textContent = t(key));

  $("loginTab").textContent = t("login");
  $("signupTab").textContent = t("signup");
  $("submitBtn").textContent = busy ? t("wait") :
    (mode === "login" ? t("login") : t("create"));
}

$("language").addEventListener("change", e => {
  language = e.target.value;
  localStorage.setItem("zridesLanguage", language);
  applyLanguage();
});

function setMode(value) {
  mode = value;
  clearMessage();

  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");
  $("nameField").classList.toggle("hidden", mode !== "signup");
  $("roleField").classList.toggle("hidden", mode !== "signup");
  $("name").required = mode === "signup";
  $("resetBtn").classList.toggle("hidden", mode === "signup");

  applyLanguage();
}

$("loginTab").onclick = () => setMode("login");
$("signupTab").onclick = () => setMode("signup");

function setBusy(value) {
  busy = value;
  $("submitBtn").disabled = value;
  applyLanguage();
}

async function redirectByRole(user) {
  await user.reload();
  user = auth.currentUser;

  if (!user) return;

  if (!user.emailVerified) {
    say(t("verify"), "info");
    $("resendBtn").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    return;
  }

  if (user.uid === ADMIN_UID) {
    location.replace("admin.html");
    return;
  }

  const snap = await db.ref("users/" + user.uid).once("value");
  const profile = snap.val();

  if (!profile || profile.uid !== user.uid) {
    say(t("profileError"), "error");
    return;
  }

  if (profile.role === "driver") {
    location.replace("driver.html");
  } else if (profile.role === "customer") {
    location.replace("index.html");
  } else {
    say(t("invalidRole"), "error");
  }
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;

  clearMessage();
  setBusy(true);

  try {
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;

    if (mode === "signup") {
      const name = $("name").value.trim();
      const role = $("role").value;

      if (name.length < 2) throw new Error(t("shortName"));
      if (!["customer","driver"].includes(role)) {
        throw new Error(t("chooseRole"));
      }

      const credential = await auth.createUserWithEmailAndPassword(
        email, password
      );

      const user = credential.user;

      try {
        await db.ref("users/" + user.uid).set({
          uid:user.uid,
          name:name,
          email:email,
          role:role,
          emailVerified:false,
          createdAt:firebase.database.ServerValue.TIMESTAMP
        });

        await user.sendEmailVerification();
      } catch (error) {
        /*
          Do not delete the Firebase Auth account automatically:
          a failed network request may leave profile creation uncertain.
        */
        console.error(error);
        throw error;
      }

      say(t("accountCreated"), "success");
      $("resendBtn").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      $("password").value = "";

    } else {
      const credential = await auth.signInWithEmailAndPassword(
        email, password
      );
      await redirectByRole(credential.user);
    }

  } catch (error) {
    console.error(error);

    let message = error.message || t("profileError");

    if (error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found") {
      message = t("loginError");
    } else if (error.code === "auth/network-request-failed") {
      message = t("network");
    } else if (error.code === "auth/email-already-in-use") {
      message = language === "ur"
        ? "Yeh email pehle se registered hai. Login karein."
        : "This email is already registered. Please log in.";
    } else if (error.code === "auth/weak-password") {
      message = language === "ur"
        ? "Mazboot password likhein."
        : "Please choose a stronger password.";
    } else if (error.code === "auth/invalid-email") {
      message = language === "ur"
        ? "Email address durust nahi."
        : "Please enter a valid email address.";
    } else if (error.code === "auth/operation-not-allowed") {
      message = language === "ur"
        ? "Firebase mein Email/Password login enable karein."
        : "Enable Email/Password sign-in in Firebase.";
    } else if (error.code === "PERMISSION_DENIED" ||
               error.code === "database/permission-denied") {
      message = t("permission");
    }

    say(message, "error");

  } finally {
    setBusy(false);
  }
});

$("resetBtn").onclick = async () => {
  clearMessage();
  const email = $("email").value.trim().toLowerCase();

  if (!email) {
    say(t("resetFirst"), "info");
    $("email").focus();
    return;
  }

  try {
    $("resetBtn").disabled = true;
    await auth.sendPasswordResetEmail(email);
    say(t("resetSent"), "success");
  } catch (error) {
    console.error(error);
    say(t("resetError"), "error");
  } finally {
    $("resetBtn").disabled = false;
  }
};

$("resendBtn").onclick = async () => {
  const user = auth.currentUser;
  if (!user) {
    say(t("verify"), "info");
    return;
  }

  try {
    $("resendBtn").disabled = true;
    await user.reload();

    if (auth.currentUser.emailVerified) {
      say(t("verified"), "success");
      return;
    }

    await auth.currentUser.sendEmailVerification();
    say(t("verificationSent"), "success");
  } catch (error) {
    console.error(error);
    say(t("resendError"), "error");
  } finally {
    $("resendBtn").disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  try {
    await auth.signOut();
    $("resendBtn").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    say(language === "ur" ? "Logout ho gaya." : "You are logged out.", "success");
  } catch (error) {
    say(t("logoutError"), "error");
  }
};

auth.onAuthStateChanged(async user => {
  if (!user) return;

  try {
    await redirectByRole(user);
  } catch (error) {
    console.error(error);
    say(t("profileError"), "error");
  }
});

applyLanguage();
setMode("login");
</script>
</body>
        </html>
