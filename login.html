<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zrides | Login & Signup</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #0f172a;
    color: white;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 28px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    box-shadow: 0 10px 35px #0005;
}

.logo {
    text-align: center;
    color: #10b981;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 24px;
    font-size: 14px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 22px;
}

.group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #cbd5e1;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus {
    border-color: #10b981;
}

button {
    cursor: pointer;
}

.primary {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: #10b981;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.primary:hover {
    background: #059669;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.secondary {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border: 1px solid #64748b;
    border-radius: 8px;
    background: transparent;
    color: white;
}

.links {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 2;
}

.link {
    color: #38bdf8;
    cursor: pointer;
    text-decoration: underline;
}

.forgot {
    text-align: right;
    margin: -5px 0 12px;
    font-size: 13px;
}

.notice {
    display: none;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.notice.success,
.notice.error,
.notice.info {
    display: block;
}

.notice.success {
    background: #064e3b;
    border: 1px solid #059669;
    color: #d1fae5;
}

.notice.error {
    background: #7f1d1d;
    border: 1px solid #dc2626;
    color: #fee2e2;
}

.notice.info {
    background: #1e3a8a;
    border: 1px solid #3b82f6;
    color: #dbeafe;
}

.home-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #94a3b8;
    font-size: 13px;
    text-decoration: none;
}

.small-note {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 15px;
}

.hidden {
    display: none !important;
}

@media(max-width: 420px) {
    .card {
        padding: 22px 18px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Zrides</div>
    <div class="subtitle">Your journey, your way.</div>

    <h2 id="formTitle">Account Login</h2>

    <div id="notice" class="notice"
         role="status" aria-live="polite"></div>

    <form id="authForm">

        <div class="group hidden" id="nameGroup">
            <label for="fullName">Full Name</label>
            <input
                id="fullName"
                type="text"
                maxlength="100"
                autocomplete="name"
                placeholder="Enter your full name">
        </div>

        <div class="group hidden" id="roleGroup">
            <label for="accountRole">Account Type</label>
            <select id="accountRole">
                <option value="customer">Customer — Book a Ride</option>
                <option value="driver">Driver — Provide Rides</option>
            </select>
        </div>

        <div class="group">
            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="name@example.com"
                required>
        </div>

        <div class="group">
            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                placeholder="At least 6 characters"
                required>
        </div>

        <div class="forgot" id="forgotGroup">
            <span class="link" id="forgotBtn">
                Forgot Password?
            </span>
        </div>

        <button class="primary" id="submitBtn" type="submit">
            Login
        </button>

    </form>

    <button class="secondary hidden" id="resendBtn" type="button">
        Resend Verification Email
    </button>

    <div class="links">
        <span id="togglePrompt">Don't have an account? </span>
        <span class="link" id="toggleBtn">Sign Up</span>
    </div>

    <a href="index.html" class="home-link">
        &#8592; Back to Homepage
    </a>

    <div class="small-note">
        If you do not receive an email, check your Spam or Junk folder.
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
    apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
    authDomain: "zrides-9f2da.firebaseapp.com",
    databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
    projectId: "zrides-9f2da",
    storageBucket: "zrides-9f2da.firebasestorage.app",
    messagingSenderId: "93898388224",
    appId: "1:93898388224:web:2e4f78e5b31dec26f839e5"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();

/*
 * Admin account UID configured for this project.
 * Database Security Rules must independently enforce
 * authorization for protected database operations.
 */
const ADMIN_UID = "cmmo7x7k0CY8lkcev4Rq92t84wU2";

let isSignup = false;
let isBusy = false;
let authActionInProgress = false;

const form = document.getElementById("authForm");
const nameInput = document.getElementById("fullName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const roleInput = document.getElementById("accountRole");

const nameGroup = document.getElementById("nameGroup");
const roleGroup = document.getElementById("roleGroup");
const forgotGroup = document.getElementById("forgotGroup");

const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const toggleBtn = document.getElementById("toggleBtn");
const togglePrompt = document.getElementById("togglePrompt");
const forgotBtn = document.getElementById("forgotBtn");
const resendBtn = document.getElementById("resendBtn");
const notice = document.getElementById("notice");

function showMessage(message, type = "info") {
    notice.textContent = message;
    notice.className = "notice " + type;
}

function clearMessage() {
    notice.textContent = "";
    notice.className = "notice";
}

function setBusy(value) {
    isBusy = value;
    submitBtn.disabled = value;

    toggleBtn.style.pointerEvents = value ? "none" : "auto";
    forgotBtn.style.pointerEvents = value ? "none" : "auto";
    resendBtn.disabled = value;

    submitBtn.textContent = value
        ? "Please wait..."
        : (isSignup ? "Create Account" : "Login");
}

function updateFormMode() {
    formTitle.textContent = isSignup
        ? "Create Your Account"
        : "Account Login";

    nameGroup.classList.toggle("hidden", !isSignup);
    roleGroup.classList.toggle("hidden", !isSignup);
    forgotGroup.classList.toggle("hidden", isSignup);

    nameInput.required = isSignup;

    passwordInput.autocomplete = isSignup
        ? "new-password"
        : "current-password";

    togglePrompt.textContent = isSignup
        ? "Already have an account? "
        : "Don't have an account? ";

    toggleBtn.textContent = isSignup ? "Login" : "Sign Up";

    submitBtn.textContent = isSignup
        ? "Create Account"
        : "Login";

    resendBtn.classList.add("hidden");
}

toggleBtn.addEventListener("click", function() {
    if (isBusy) return;

    isSignup = !isSignup;

    clearMessage();
    updateFormMode();
});

function getFriendlyError(error) {
    const code = error && error.code ? error.code : "";

    const messages = {
        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/user-not-found":
            "No account found. Please sign up first.",

        "auth/wrong-password":
            "Incorrect email or password.",

        "auth/invalid-credential":
            "Incorrect email or password.",

        "auth/email-already-in-use":
            "This email already has an account. Please log in.",

        "auth/weak-password":
            "Use a password containing at least 6 characters.",

        "auth/too-many-requests":
            "Too many attempts. Please wait and try again.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/operation-not-allowed":
            "Enable Email/Password in Firebase Authentication.",

        "auth/invalid-api-key":
            "Check your Firebase configuration.",

        "auth/user-disabled":
            "This account has been disabled."
    };

    return messages[code] ||
        "Something went wrong. Please try again. " +
        (code || "");
}

/*
 * Read the existing profile and route by its role.
 * Do not automatically create an admin profile here.
 */
async function redirectByRole(user) {
    const snapshot = await db.ref("users/" + user.uid).once("value");
    const profile = snapshot.val();

    if (!profile || !profile.role) {
        showMessage(
            "Your account profile is missing. Contact the administrator.",
            "error"
        );

        await auth.signOut();
        return;
    }

    const role = profile.role;

    if (role === "admin") {
        if (user.uid !== ADMIN_UID) {
            showMessage("Admin access denied.", "error");
            await auth.signOut();
            return;
        }

        window.location.replace("admin.html");
        return;
    }

    if (role === "driver") {
        window.location.replace("driver.html");
        return;
    }

    if (role === "customer") {
        window.location.replace("index.html");
        return;
    }

    showMessage(
        "This account has an unsupported role. Contact the administrator.",
        "error"
    );

    await auth.signOut();
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (isBusy) return;

    clearMessage();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const fullName = nameInput.value.trim();
    const selectedRole = roleInput.value;

    if (!email) {
        showMessage("Enter your email address.", "error");
        return;
    }

    if (password.length < 6) {
        showMessage(
            "Your password must contain at least 6 characters.",
            "error"
        );
        return;
    }

    if (isSignup && !fullName) {
        showMessage("Enter your full name.", "error");
        return;
    }

    if (isSignup &&
        !["customer", "driver"].includes(selectedRole)) {
        showMessage("Select a valid account type.", "error");
        return;
    }

    setBusy(true);
    authActionInProgress = true;

    try {
        if (isSignup) {
            const credential =
                await auth.createUserWithEmailAndPassword(
                    email,
                    password
                );

            const user = credential.user;

            try {
                await user.updateProfile({
                    displayName: fullName
                });

                await db.ref("users/" + user.uid).set({
                    uid: user.uid,
                    name: fullName,
                    email: email,
                    role: selectedRole,
                    emailVerified: false,
                    createdAt:
                        firebase.database.ServerValue.TIMESTAMP
                });

                await user.sendEmailVerification();
                await auth.signOut();

                isSignup = false;
                updateFormMode();

                emailInput.value = email;
                passwordInput.value = "";

                showMessage(
                    "Account created. A verification email has been sent. Verify your email, then log in.",
                    "success"
                );

            } catch (error) {
                console.error("Signup setup error:", error);

                showMessage(
                    "Your account may have been created, but profile or verification setup failed. " +
                    getFriendlyError(error),
                    "error"
                );

                if (auth.currentUser) {
                    await auth.signOut();
                }
            }

        } else {
            const credential =
                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );

            const user = credential.user;

            await user.reload();

            if (!user.emailVerified) {
                resendBtn.classList.remove("hidden");

                await auth.signOut();

                showMessage(
                    "Your email is not verified. Verify it first, or use Resend Verification Email.",
                    "error"
                );

                return;
            }

            /*
             * Check for the pre-authorized Admin UID.
             * The database role alone does not grant admin access.
             */
            const profileRef = db.ref("users/" + user.uid);
            const snapshot = await profileRef.once("value");
            const profile = snapshot.val();

            if (user.uid === ADMIN_UID) {
                if (!profile || profile.role !== "admin") {
                    showMessage(
                        "Admin account profile is missing or its role is not set to admin. Check the users record in Firebase.",
                        "error"
                    );

                    await auth.signOut();
                    return;
                }

                await profileRef.update({
                    emailVerified: true
                });

                await redirectByRole(user);
                return;
            }

            if (!profile || !profile.role) {
                showMessage(
                    "Your account profile is missing. Contact the administrator.",
                    "error"
                );

                await auth.signOut();
                return;
            }

            await profileRef.update({
                emailVerified: true
            });

            await redirectByRole(user);
        }

    } catch (error) {
        console.error("Authentication error:", error);
        showMessage(getFriendlyError(error), "error");

    } finally {
        authActionInProgress = false;
        setBusy(false);
    }
});

/*
 * Resend email verification.
 */
resendBtn.addEventListener("click", async function() {
    if (isBusy) return;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage(
            "Enter your email and password first.",
            "info"
        );
        return;
    }

    setBusy(true);
    authActionInProgress = true;

    try {
        const credential =
            await auth.signInWithEmailAndPassword(email, password);

        const user = credential.user;

        await user.reload();

        if (user.emailVerified) {
            await auth.signOut();

            resendBtn.classList.add("hidden");

            showMessage(
                "Your email is already verified. You can log in.",
                "success"
            );

            return;
        }

        await user.sendEmailVerification();
        await auth.signOut();

        showMessage(
            "A new verification email has been sent. Check Inbox and Spam/Junk.",
            "success"
        );

    } catch (error) {
        showMessage(getFriendlyError(error), "error");

    } finally {
        authActionInProgress = false;
        setBusy(false);
    }
});

/*
 * Password reset.
 */
forgotBtn.addEventListener("click", async function() {
    if (isBusy) return;

    const email = emailInput.value.trim();

    if (!email) {
        showMessage(
            "Enter your registered email address first.",
            "info"
        );
        emailInput.focus();
        return;
    }

    setBusy(true);

    try {
        await auth.sendPasswordResetEmail(email);

        showMessage(
            "If an account exists for this address, a reset email will be sent. Check Inbox and Spam/Junk.",
            "success"
        );

    } catch (error) {
        showMessage(getFriendlyError(error), "error");

    } finally {
        setBusy(false);
    }
});

/*
 * Handle an existing Firebase session.
 */
auth.onAuthStateChanged(async function(user) {
    if (!user || authActionInProgress || isBusy) return;

    try {
        await user.reload();

        if (!user.emailVerified) return;

        await redirectByRole(user);

    } catch (error) {
        console.error("Authentication state error:", error);
    }
});

updateFormMode();
</script>

</body>
    </html>
