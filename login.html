<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides - Login & Password Recovery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .auth-card h2 { text-align: center; margin-bottom: 20px; color: #10b981; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; font-size: 15px; }
        .btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #059669; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #38bdf8; cursor: pointer; }
        .forgot-link { text-align: right; margin-top: -8px; margin-bottom: 12px; font-size: 13px; color: #f59e0b; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
        .back-home { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .notice-box { background: #334155; border-left: 4px solid #38bdf8; padding: 10px; font-size: 12px; margin-bottom: 15px; border-radius: 4px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="formTitle">Account Login</h2>
        <div class="notice-box">
            💡 <strong>Verification & Recovery Tip:</strong> If you don't see emails in your inbox, please check your <strong>Spam / Junk</strong> folder.
        </div>
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display:none;">
                <label>Full Name:</label>
                <input type="text" id="fullName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group" id="passGroup">
                <label>Password:</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            
            <!-- Forgot Password Link -->
            <div class="forgot-link" id="forgotBtn" onclick="resetPassword()">Forgot Password?</div>

            <button type="submit" class="btn" id="submitBtn">Login</button>
        </form>
        <div class="toggle-link" onclick="toggleAuthMode()" id="toggleText">Don't have an account? Sign Up</div>
        <a href="index.html" class="back-home">← Back to Homepage</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
            authDomain: "zrides-9f2da.firebaseapp.com",
            databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
            projectId: "zrides-9f2da",
            storageBucket: "zrides-9f2da.firebasestorage.app",
            messagingSenderId: "93898388224",
            appId: "1:93898388224:web:2e4f78e5b31dec26f839e5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isSignup = false;

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('formTitle').innerText = isSignup ? "Create Secure Account" : "Account Login";
            document.getElementById('submitBtn').innerText = isSignup ? "Create Account & Verify" : "Login";
            document.getElementById('nameGroup').style.display = isSignup ? "block" : "none";
            document.getElementById('forgotBtn').style.display = isSignup ? "none" : "block";
            document.getElementById('toggleText').innerText = isSignup ? "Already have an account? Login" : "Don't have an account? Sign Up";
        }

        // Login & Signup Submission
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (isSignup) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        userCredential.user.sendEmailVerification().then(() => {
                            alert("Account created successfully!\n\nA verification link has been sent to your email. Please check your inbox and SPAM folder to verify your account before logging in.");
                            toggleAuthMode();
                        });
                    })
                    .catch(error => alert("Registration Error: " + error.message));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        if (userCredential.user.emailVerified) {
                            alert("Login successful!");
                            window.location.href = "index.html";
                        } else {
                            alert("Your email is not verified yet!\n\nPlease check your inbox or Spam/Junk folder and click the verification link.");
                            auth.signOut();
                        }
                    })
                    .catch(error => alert("Login Failed: " + error.message));
            }
        });

        // Password Recovery Function
        function resetPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert("Please enter your registered Email Address first in the input field above, then click 'Forgot Password'.");
                return;
            }

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert("Password Reset Link Sent!\n\nPlease check your email inbox (and Spam/Junk folder) for instructions to reset your password.");
                })
                .catch((error) => {
                    alert("Error sending password reset email: " + error.message);
                });
        }
    </script>
</body>
</html>
