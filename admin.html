<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Zrides | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#4ade80}
header select{width:auto;padding:10px}
button,select{cursor:pointer}
button{padding:10px 13px;border:0;border-radius:8px;background:#16a34a;color:white;font-weight:bold}
main{max-width:1100px;margin:24px auto;padding:0 15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:15px;overflow-wrap:anywhere}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
.muted{color:#6b7280;font-size:14px;line-height:1.5}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}
.reject{background:#dc2626}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo">Zrides Admin</div>
  <div class="row" style="flex:0;align-items:center;margin:0">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 id="heading">Admin Dashboard</h2>
    <p id="intro" class="muted">Manage driver applications and ride requests.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2 id="driversHeading">Driver Applications</h2>
    <div id="drivers"><p class="muted">Loading drivers...</p></div>
  </div>

  <div class="card">
    <h2 id="ordersHeading">Ride Orders</h2>
    <div id="orders"><p class="muted">Loading orders...</p></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
"use strict";

const firebaseConfig={
  apiKey:"AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
  authDomain:"zrides-9f2da.firebaseapp.com",
  databaseURL:"https://zrides-9f2da-default-rtdb.firebaseio.com",
  projectId:"zrides-9f2da",
  storageBucket:"zrides-9f2da.firebasestorage.app",
  messagingSenderId:"93898388224",
  appId:"1:93898388224:web:2e4f78e5b31dec26f839e5"
};

const ADMIN_UID="cmmo7x7k0CY8lkcev4Rq92t84wU2";

if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);

const words={
 en:{
  heading:"Admin Dashboard",intro:"Manage driver applications and ride requests.",
  drivers:"Driver Applications",orders:"Ride Orders",
  logout:"Logout",loadingDrivers:"Loading drivers...",
  loadingOrders:"Loading orders...",noDrivers:"No driver applications found.",
  noOrders:"No ride orders found.",approve:"Approve",reject:"Reject",
  pending:"Pending",approved:"Approved",rejected:"Rejected",
  driver:"Driver",name:"Name",email:"Email",phone:"Phone",
  vehicle:"Vehicle",plate:"Registration",wallet:"Wallet balance",
  pickup:"Pickup",dropoff:"Destination",customer:"Customer",
  fare:"Fare",status:"Status",created:"Created",
  approveSuccess:"Driver approved.",rejectSuccess:"Driver rejected.",
  updateError:"Unable to update driver status.",
  authError:"You are not authorized to access this page.",
  verifyError:"Verify the admin email before continuing.",
  loadError:"Unable to load data. Check database permissions.",
  accepted:"Accepted",arrived:"Driver Arrived",started:"Started",
  completed:"Completed",cancelled:"Cancelled",unknown:"Unknown"
 },
 ur:{
  heading:"Admin Dashboard",intro:"Driver applications aur ride requests manage karein.",
  drivers:"Driver Applications",orders:"Ride Orders",
  logout:"Logout",loadingDrivers:"Drivers load ho rahe hain...",
  loadingOrders:"Orders load ho rahe hain...",noDrivers:"Koi driver application nahi.",
  noOrders:"Koi ride order nahi.",approve:"Approve Karein",reject:"Reject Karein",
  pending:"Pending",approved:"Approve",rejected:"Reject",
  driver:"Driver",name:"Naam",email:"Email",phone:"Phone",
  vehicle:"Vehicle",plate:"Registration",wallet:"Wallet balance",
  pickup:"Pickup",dropoff:"Manzil",customer:"Customer",
  fare:"Kiraya",status:"Status",created:"Banaya gaya",
  approveSuccess:"Driver approve ho gaya.",rejectSuccess:"Driver reject ho gaya.",
  updateError:"Driver status update nahi ho saka.",
  authError:"Aapko is page ka access nahi hai.",
  verifyError:"Admin email verify karein.",
  loadError:"Data load nahi hua. Database permissions check karein.",
  accepted:"Accept ho gayi",arrived:"Driver Pohanch Gaya",started:"Shuru",
  completed:"Mukammal",cancelled:"Cancel",unknown:"Maloom nahi"
 }
};

let lang=localStorage.getItem("zridesLanguage")||"en";
let driversRef=null,ordersRef=null;

function t(k){return words[lang][k]||words.en[k]||k;}
function notify(text,type="info"){
 $("message").textContent=text;
 $("message").className="message "+type;
}
function applyLanguage(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ur"?"rtl":"ltr";
 $("language").value=lang;
 $("heading").textContent=t("heading");
 $("intro").textContent=t("intro");
 $("driversHeading").textContent=t("drivers");
 $("ordersHeading").textContent=t("orders");
 $("logoutBtn").textContent=t("logout");
 renderDrivers();
 renderOrders();
}
$("language").onchange=e=>{
 lang=e.target.value;
 localStorage.setItem("zridesLanguage",lang);
 applyLanguage();
};

function el(tag,text){
 const node=document.createElement(tag);
 node.textContent=String(text??"");
 return node;
}

function showStatus(status){
 return t(status||"pending");
}

async function setDriverApproval(uid,status){
 if(!["approved","rejected"].includes(status))return;

 try{
  /*
    Admin UID and role are checked here. Firebase Database Rules must
    independently enforce admin-only writes.
  */
  const result=await db.ref("drivers/"+uid).transaction(driver=>{
   if(!driver||driver.uid!==uid)return;
   driver.approvalStatus=status;
   driver.updatedAt=firebase.database.ServerValue.TIMESTAMP;
   return driver;
  });

  if(!result.committed){
   notify(t("updateError"),"error");
   return;
  }

  notify(t(status==="approved"?"approveSuccess":"rejectSuccess"),"success");
 }catch(error){
  console.error(error);
  notify(t("updateError"),"error");
 }
}

let driverData={},orderData={};

function renderDrivers(){
 const box=$("drivers");
 box.replaceChildren();

 const list=Object.entries(driverData);

 if(!list.length){
  box.appendChild(el("p",t("noDrivers")));
  return;
 }

 list.forEach(([uid,d])=>{
  const card=document.createElement("div");
  card.className="item";

  card.appendChild(el("h3",d.name||t("unknown")));
  card.appendChild(el("p",t("email")+": "+(d.email||"—")));
  card.appendChild(el("p",t("phone")+": "+(d.phone||"—")));
  card.appendChild(el("p",t("vehicle")+": "+t(d.vehicle||"unknown")));
  card.appendChild(el("p",t("plate")+": "+(d.plate||"—")));
  card.appendChild(el("p",t("status")+": "+showStatus(d.approvalStatus)));

  const row=document.createElement("div");
  row.className="row";

  if(d.approvalStatus!=="approved"){
   const approve=el("button",t("approve"));
   approve.onclick=()=>setDriverApproval(uid,"approved");
   row.appendChild(approve);
  }

  if(d.approvalStatus!=="rejected"){
   const reject=el("button",t("reject"));
   reject.className="reject";
   reject.onclick=()=>setDriverApproval(uid,"rejected");
   row.appendChild(reject);
  }

  card.appendChild(row);
  box.appendChild(card);
 });
}

function renderOrders(){
 const box=$("orders");
 box.replaceChildren();

 const list=Object.entries(orderData)
   .map(([id,o])=>({id,...o}))
   .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

 if(!list.length){
  box.appendChild(el("p",t("noOrders")));
  return;
 }

 list.forEach(o=>{
  const card=document.createElement("div");
  card.className="item";

  card.appendChild(el("h3",o.pickup+" → "+o.dropoff));
  card.appendChild(el("p",t("customer")+": "+(o.customerName||o.customerEmail||"—")));
  card.appendChild(el("p",t("phone")+": "+(o.customerPhone||"—")));
  card.appendChild(el("p",t("fare")+": "+(o.fare??"—")));
  card.appendChild(el("p",t("status")+": "+showStatus(o.status)));
  card.appendChild(el("p",t("driver")+": "+(o.driverName||"—")));
  box.appendChild(card);
 });
}

async function startAdmin(user){
 if(user.uid!==ADMIN_UID){
  notify(t("authError"),"error");
  await auth.signOut();
  return;
 }

 await user.reload();
 user=auth.currentUser;

 if(!user||!user.emailVerified){
  notify(t("verifyError"),"error");
  return;
 }

 const profileSnap=await db.ref("users/"+user.uid).once("value");
 const profile=profileSnap.val();

 if(!profile||profile.uid!==user.uid||profile.role!=="admin"){
  notify(t("authError"),"error");
  return;
 }

 driversRef=db.ref("drivers");
 driversRef.on("value",snap=>{
  driverData=snap.val()||{};
  renderDrivers();
 },error=>{
  console.error(error);
  notify(t("loadError"),"error");
 });

 ordersRef=db.ref("orders");
 ordersRef.on("value",snap=>{
  orderData=snap.val()||{};
  renderOrders();
 },error=>{
  console.error(error);
  notify(t("loadError"),"error");
 });
}

$("logoutBtn").onclick=async()=>{
 if(driversRef)driversRef.off();
 if(ordersRef)ordersRef.off();
 await auth.signOut();
 location.replace("login.html");
};

auth.onAuthStateChanged(user=>{
 if(!user){
  location.replace("login.html");
  return;
 }

 startAdmin(user).catch(error=>{
  console.error(error);
  notify(t("authError"),"error");
 });
});

applyLanguage();
</script>
</body>
</html>
