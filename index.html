<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zrides - Professional Ride & Delivery Platform</title>

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        
        header { background-color: #0f172a; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-size: 26px; font-weight: bold; color: #10b981; letter-spacing: 1px; }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 500; font-size: 15px; }
        .btn-nav { background: #10b981; padding: 8px 16px; border-radius: 6px; transition: 0.3s; }
        .btn-nav:hover { background: #059669; }
        .btn-outline { border: 1px solid #475569; padding: 7px 15px; border-radius: 6px; }

        .hero { background: linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.85)), url('https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=1000') center/cover; height: 180px; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .hero h1 { font-size: 26px; margin-bottom: 5px; color: #34d399; }

        .main-container { max-width: 1200px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h2 { color: #0f172a; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: #fff; }

        .fare-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 15px; text-align: center; margin: 20px 0; }
        .fare-box h3 { color: #15803d; font-size: 24px; margin-top: 5px; }

        .btn-submit { width: 100%; background-color: #10b981; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-submit:hover { background-color: #059669; }

        #map { height: 100%; min-height: 420px; border-radius: 8px; border: 1px solid #cbd5e1; }
        
        footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 20px; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zrides.pk</div>
        <nav>
            <a href="login.html" class="btn-outline" id="navLogin">لاگ ان / سائن اپ</a>
            <a href="driver.html" class="btn-nav" id="navPartner">ڈرائیور پورٹل</a>
            <a href="#" onclick="toggleLanguage()" id="langBtn" style="color: #38bdf8;">English</a>
        </nav>
    </header>

    <section class="hero">
        <h1 id="heroTitle">محفوظ اور تیز ترین رائیڈ سروس</h1>
        <p id="heroSubtitle">اپنا مقام چنیں اور منٹوں میں سواری یا پارسل ڈیلیوری حاصل کریں</p>
    </section>

    <div class="main-container">
        <div class="card">
            <h2 id="formTitle">فوری بکنگ فارم</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label id="lblService">سروس کی قسم منتخب کریں:</label>
                    <select id="serviceType" onchange="calculateFare()">
                        <option value="بائیک رائیڈ (Bike Ride)">🏍️ بائیک رائیڈ (Bike Ride)</option>
                        <option value="آٹو رکشہ (Rickshaw)">🛺 آٹو رکشہ (Auto Rickshaw)</option>
                        <option value="پارسل ڈیلیوری (Parcel Delivery)">📦 پارسل ڈیلیوری (Parcel Delivery)</option>
                        <option value="خریدو سروس (Buy For Me)">🛒 خریدو سروس (Buy For Me)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="lblPickup">پک اپ لوکیشن (Pickup Location):</label>
                    <input type="text" id="pickup" placeholder="مثلاً: صدر بازار، لاہور" required>
                </div>

                <div class="form-group">
                    <label id="lblDropoff">ڈراپ آف لوکیشن (Dropoff Location):</label>
                    <input type="text" id="dropoff" placeholder="مثلاً: ڈی ایچ اے فیز 5، لاہور" required>
                </div>

                <div class="form-group">
                    <label id="lblDistance">تخمینہ شدہ فاصلہ (کلومیٹر):</label>
                    <input type="number" id="distance" value="5" min="1" max="100" oninput="calculateFare()">
                </div>

                <div class="fare-box">
                    <p id="lblTotalFare">کل متوقع کرایہ:</p>
                    <h3 id="estimatedFare">Rs. 150</h3>
                </div>

                <div class="form-group">
                    <label id="lblPhone">آپ کا موبائل نمبر:</label>
                    <input type="tel" id="phone" placeholder="03001234567" required>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">بکنگ کنفرم کریں</button>
            </form>
        </div>

        <div class="card" style="padding: 10px;">
            <div id="map"></div>
        </div>
    </div>

    <footer>
        <p id="footerText">© 2026 Zrides Pakistan (Pvt) Ltd. تمام حقوق محفوظ ہیں۔</p>
    </footer>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
            authDomain: "zrides-9f2da.firebaseapp.com",
            databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
            projectId: "zrides-9f2da",
            storageBucket: "zrides-9f2da.firebasestorage.app",
            messagingSenderId: "93898388224",
            appId: "1:93898388224:web:2e4f78e5b31dec26f839e5",
            measurementId: "G-XCGVR3L9YV"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        var map = L.map('map').setView([31.5204, 74.3587], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        var marker = L.marker([31.5204, 74.3587]).addTo(map).bindPopup('Zrides مرکز').openPopup();

        // Tap on Map to set Pickup location
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(4);
            var lng = e.latlng.lng.toFixed(4);
            document.getElementById('pickup').value = "Lat: " + lat + ", Lng: " + lng;
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map).bindPopup("پک اپ مقام").openPopup();
        });

        function calculateFare() {
            var service = document.getElementById('serviceType').value;
            var distance = parseFloat(document.getElementById('distance').value) || 0;
            var baseFare = 50; var perKm = 20;

            if (service.includes('Rickshaw')) { baseFare = 80; perKm = 35; }
            else if (service.includes('Parcel')) { baseFare = 60; perKm = 25; }
            else if (service.includes('Buy')) { baseFare = 100; perKm = 20; }

            var total = baseFare + (distance * perKm);
            document.getElementById('estimatedFare').innerText = "Rs. " + Math.round(total);
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var service = document.getElementById('serviceType').value;
            var pickup = document.getElementById('pickup').value.trim();
            var dropoff = document.getElementById('dropoff').value.trim();
            var distance = document.getElementById('distance').value;
            var phone = document.getElementById('phone').value.trim();
            var fare = document.getElementById('estimatedFare').innerText;

            db.ref('orders/').push({
                service: service,
                pickup: pickup,
                dropoff: dropoff,
                distance: distance,
                phone: phone,
                fare: fare,
                offeredFare: fare,
                status: 'pending',
                timestamp: new Date().toLocaleString()
            }, function(error) {
                if (error) {
                    alert("بکنگ میں خرابی: " + error.message);
                } else {
                    alert("مبارک ہو! آپ کا آرڈر ڈرائیورز کو بھیج دیا گیا ہے۔");
                    document.getElementById('bookingForm').reset();
                    calculateFare();
                }
            });
        });

        let isUrdu = true;
        function toggleLanguage() {
            isUrdu = !isUrdu;
            const htmlTag = document.getElementById('htmlTag');
            htmlTag.setAttribute('dir', isUrdu ? 'rtl' : 'ltr');
            htmlTag.setAttribute('lang', isUrdu ? 'ur' : 'en');
            document.getElementById('langBtn').innerText = isUrdu ? "English" : "اردو";
        }
    </script>
</body>
</html>
