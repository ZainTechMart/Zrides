<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Zrides | Book a Ride</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#4ade80}
select,input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;background:white}
button{padding:11px 14px;border:0;border-radius:8px;background:#16a34a;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
header select{width:auto}
main{max-width:850px;margin:24px auto;padding:0 15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 18px #0001}
.field{margin:14px 0}
label{display:block;font-weight:bold;margin-bottom:7px}
.muted{color:#6b7280;font-size:14px;line-height:1.5}
.message{padding:12px;border-radius:8px;margin-bottom:15px;display:none;overflow-wrap:anywhere}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
.ride{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.chatMessages{height:180px;overflow-y:auto;background:#f9fafb;border:1px solid #e5e7eb;padding:10px;margin:10px 0}
.chatMessage{padding:8px;margin:6px 0;background:#e5e7eb;border-radius:8px;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">Zrides</div>
  <div class="row" style="flex:0;align-items:center">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<main>
  <div class="card">
    <h2 id="welcome">Book Your Ride</h2>
    <p id="intro" class="muted">Enter your trip details to request a ride.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="bookingForm">
      <div class="field">
        <label id="pickupLabel" for="pickup">Pickup Location</label>
        <input id="pickup" maxlength="200" required>
      </div>

      <div class="field">
        <label id="dropoffLabel" for="dropoff">Destination</label>
        <input id="dropoff" maxlength="200" required>
      </div>

      <div class="field">
        <label id="phoneLabel" for="phone">Contact Phone</label>
        <input id="phone" type="tel" maxlength="25" required>
      </div>

      <div class="field">
        <label id="serviceLabel" for="service">Ride Type</label>
        <select id="service">
          <option value="bike">Bike</option>
          <option value="car">Car</option>
          <option value="rickshaw">Rickshaw</option>
        </select>
      </div>

      <button id="bookBtn" type="submit">Request Ride</button>
    </form>
  </div>

  <div class="card">
    <h2 id="ridesHeading">My Rides</h2>
    <div id="rides"><p class="muted">Loading rides...</p></div>
  </div>

  <div class="card hidden" id="chatCard">
    <h2 id="chatHeading">Ride Chat</h2>
    <p id="chatInfo" class="muted">Messages for your selected ride.</p>
    <div id="chatMessages" class="chatMessages"></div>
    <form id="chatForm">
      <div class="row">
        <input id="chatInput" maxlength="1000" required>
        <button id="sendBtn" type="submit">Send</button>
      </div>
    </form>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAeMh8vdyKhSqHFPa0cWsV6M_Tdu7vJKNY",
  authDomain: "zrides-9f2da.firebaseapp.com",
  databaseURL: "https://zrides-9f2da-default-rtdb.firebaseio.com",
  projectId: "zrides-9f2da",
  storageBucket: "zrides-9f2da.firebasestorage.app",
  messagingSenderId: "93898388224",
  appId: "1:93898388224:web:2e4f78e5b31dec26f839e5"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const $ = id => document.getElementById(id);

const words = {
  en:{
    welcome:"Book Your Ride",intro:"Enter your trip details to request a ride.",
    pickup:"Pickup Location",dropoff:"Destination",phone:"Contact Phone",
    service:"Ride Type",book:"Request Ride",wait:"Please wait...",
    rides:"My Rides",loading:"Loading rides...",noRides:"You have no rides yet.",
    logout:"Logout",chat:"Ride Chat",chatInfo:"Messages for your selected ride.",
    send:"Send",bike:"Bike",car:"Car",rickshaw:"Rickshaw",
    pending:"Pending",accepted:"Accepted",arrived:"Driver Arrived",
    started:"Ride Started",completed:"Completed",cancelled:"Cancelled",
    booked:"Ride request submitted.",bookError:"Unable to request a ride.",
    needLogin:"Please log in to continue.",verify:"Verify your email before booking.",
    profile:"Your customer profile could not be verified.",
    selectRide:"Select Chat on one of your rides to open its chat.",
    chatError:"Unable to load chat. Check your connection and permissions.",
    messageRequired:"Please enter a message.",noPhone:"Please enter a contact phone number.",
    cancelledMsg:"Ride cancelled.",cancelError:"Unable to cancel this ride.",
    pickupRequired:"Enter pickup and destination.",
    fare:"Estimated fare",status:"Status",driver:"Driver",
    cancel:"Cancel Ride",openChat:"Chat",noDriver:"Not assigned",
    sendError:"Unable to send message.",unknown:"Unknown",
    unauthorized:"This account is not authorized as a customer."
  },
  ur:{
    welcome:"Apni Ride Book Karein",intro:"Ride request karne ke liye safar ki maloomat likhein.",
    pickup:"Pickup Location",dropoff:"Manzil",phone:"Rabtay ka Phone",
    service:"Ride ki Qisam",book:"Ride Request Karein",wait:"Barah-e-karam intezar karein...",
    rides:"Meri Rides",loading:"Rides load ho rahi hain...",noRides:"Abhi aapki koi ride nahi.",
    logout:"Logout",chat:"Ride Chat",chatInfo:"Apni selected ride ke messages.",
    send:"Bhejein",bike:"Bike",car:"Car",rickshaw:"Rickshaw",
    pending:"Pending",accepted:"Accept ho gayi",arrived:"Driver Pohanch Gaya",
    started:"Ride Shuru",completed:"Mukammal",cancelled:"Cancel",
    booked:"Ride request bhej di gayi.",bookError:"Ride request nahi bheji ja saki.",
    needLogin:"Jari rakhne ke liye login karein.",verify:"Booking se pehle email verify karein.",
    profile:"Customer profile verify nahi ho saki.",
    selectRide:"Chat kholne ke liye apni kisi ride par Chat dabayein.",
    chatError:"Chat load nahi hui. Internet aur permissions check karein.",
    messageRequired:"Message likhein.",noPhone:"Contact phone number likhein.",
    cancelledMsg:"Ride cancel kar di gayi.",cancelError:"Ride cancel nahi ho saki.",
    pickupRequired:"Pickup aur destination likhein.",
    fare:"Andazati kiraya",status:"Status",driver:"Driver",
    cancel:"Ride Cancel",openChat:"Chat",noDriver:"Abhi assign nahi",
    sendError:"Message nahi bheja ja saka.",unknown:"Maloom nahi",
    unauthorized:"Yeh account customer ke taur par authorized nahi."
  }
};

let lang = localStorage.getItem("zridesLanguage") || "en";
let currentUser = null;
let myOrdersRef = null;
let chatRef = null;
let activeChatOrder = null;
let bookingBusy = false;

function t(k){return words[lang][k] || words.en[k] || k;}
function notify(text,type="info"){
  $("message").textContent=text;
  $("message").className="message "+type;
}
function applyLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  $("language").value=lang;
  const map={
    welcome:"welcome",intro:"intro",pickupLabel:"pickup",
    dropoffLabel:"dropoff",phoneLabel:"phone",serviceLabel:"service",
    bookBtn:"book",ridesHeading:"rides",logoutBtn:"logout",
    chatHeading:"chat",chatInfo:"chatInfo",sendBtn:"send"
  };
  Object.entries(map).forEach(([id,key])=>$(id).textContent=t(key));
  $("pickup").placeholder=t("pickup");
  $("dropoff").placeholder=t("dropoff");
  $("phone").placeholder=t("phone");
  $("chatInput").placeholder=lang==="ur"?"Apna message likhein":"Type your message";
  [...$("service").options].forEach(o=>o.textContent=t(o.value));
  renderRides();
}

$("language").onchange=e=>{
  lang=e.target.value;
  localStorage.setItem("zridesLanguage",lang);
  applyLanguage();
};

function safeText(value){
  return String(value ?? "");
}

function statusLabel(status){
  const key=({
    pending:"pending",accepted:"accepted",arrived:"arrived",
    started:"started",completed:"completed",cancelled:"cancelled"
  })[status] || status || "pending";
  return t(key);
}

function renderRides(){
  if(!currentUser)return;
  const container=$("rides");
  const ordersRef=db.ref("orders");

  ordersRef.orderByChild("customerUid").equalTo(currentUser.uid)
    .once("value")
    .then(snap=>{
      const list=[];
      snap.forEach(child=>list.push({id:child.key,...child.val()}));
      list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

      container.replaceChildren();

      if(!list.length){
        const p=document.createElement("p");
        p.className="muted";
        p.textContent=t("noRides");
        container.appendChild(p);
        return;
      }

      list.forEach(order=>{
        const box=document.createElement("div");
        box.className="ride";

        const title=document.createElement("h3");
        title.textContent=safeText(order.pickup)+" → "+safeText(order.dropoff);
        box.appendChild(title);

        const details=document.createElement("p");
        details.className="muted";
        details.textContent=
          t("status")+": "+statusLabel(order.status)+
          " | "+t("fare")+": "+(order.fare ?? "—");
        box.appendChild(details);

        if(order.driverUid){
          const driver=document.createElement("p");
          driver.className="muted";
          driver.textContent=t("driver")+": "+safeText(order.driverName||t("noDriver"));
          box.appendChild(driver);
        }

        if(!["completed","cancelled"].includes(order.status)){
          const row=document.createElement("div");
          row.className="row";
          row.style.marginTop="10px";

          const chatBtn=document.createElement("button");
          chatBtn.textContent=t("openChat");
          chatBtn.onclick=()=>openChat(order.id);
          row.appendChild(chatBtn);

          const cancelBtn=document.createElement("button");
          cancelBtn.textContent=t("cancel");
          cancelBtn.style.background="#dc2626";
          cancelBtn.onclick=()=>cancelRide(order.id);
          if(order.status!=="pending")cancelBtn.disabled=true;
          row.appendChild(cancelBtn);

          box.appendChild(row);
        }

        container.appendChild(box);
      });
    })
    .catch(error=>{
      console.error(error);
      notify(t("chatError"),"error");
    });
}

async function cancelRide(orderId){
  try{
    const ref=db.ref("orders/"+orderId);
    const result=await ref.transaction(order=>{
      if(!order)return;
      if(order.customerUid!==currentUser.uid)return;
      if(order.status!=="pending")return;
      order.status="cancelled";
      order.updatedAt=firebase.database.ServerValue.TIMESTAMP;
      return order;
    });

    if(!result.committed){
      notify(t("cancelError"),"error");
      return;
    }

    await db.ref("rideQueue/"+orderId).update({
      status:"cancelled",
      updatedAt:firebase.database.ServerValue.TIMESTAMP
    });

    notify(t("cancelledMsg"),"success");
    renderRides();
  }catch(error){
    console.error(error);
    notify(t("cancelError"),"error");
  }
}

$("bookingForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(bookingBusy)return;

  if(!currentUser){
    notify(t("needLogin"),"error");
    return;
  }
  if(!currentUser.emailVerified){
    notify(t("verify"),"error");
    return;
  }

  const pickup=$("pickup").value.trim();
  const dropoff=$("dropoff").value.trim();
  const phone=$("phone").value.trim();
  const service=$("service").value;

  if(!pickup||!dropoff){
    notify(t("pickupRequired"),"error");
    return;
  }
  if(!phone){
    notify(t("noPhone"),"error");
    return;
  }

  bookingBusy=true;
  $("bookBtn").disabled=true;
  $("bookBtn").textContent=t("wait");

  try{
    const profileSnap=await db.ref("users/"+currentUser.uid).once("value");
    const profile=profileSnap.val();

    if(!profile||profile.uid!==currentUser.uid||profile.role!=="customer"){
      throw new Error(t("unauthorized"));
    }

    /*
      This is a provisional fare estimate, not a live distance calculation.
      A production fare must be calculated and validated by a trusted backend.
    */
    const fareEstimate=service==="bike"?150:service==="car"?350:200;

    const orderRef=db.ref("orders").push();
    const orderId=orderRef.key;
    const timestamp=firebase.database.ServerValue.TIMESTAMP;

    const order={
      id:orderId,
      customerUid:currentUser.uid,
      customerEmail:currentUser.email,
      customerName:profile.name||"",
      customerPhone:phone,
      pickup:pickup,
      dropoff:dropoff,
      service:service,
      fare:fareEstimate,
      status:"pending",
      driverUid:null,
      createdAt:Date.now(),
      updatedAt:timestamp
    };

    /*
      Queue contains only basic ride details. Do not put customer phone/email
      into rideQueue. Access still depends on correctly configured RTDB rules.
    */
    const updates={};
    updates["orders/"+orderId]=order;
    updates["rideQueue/"+orderId]={
      orderId:orderId,
      pickup:pickup,
      dropoff:dropoff,
      service:service,
      fare:fareEstimate,
      status:"pending",
      createdAt:Date.now()
    };

    await db.ref().update(updates);

    $("bookingForm").reset();
    notify(t("booked"),"success");
    renderRides();

  }catch(error){
    console.error(error);
    notify(error.message||t("bookError"),"error");
  }finally{
    bookingBusy=false;
    $("bookBtn").disabled=false;
    $("bookBtn").textContent=t("book");
  }
});

function openChat(orderId){
  if(chatRef)chatRef.off();
  activeChatOrder=orderId;
  $("chatCard").classList.remove("hidden");
  $("chatMessages").replaceChildren();

  chatRef=db.ref("chats/"+orderId+"/messages");
  chatRef.limitToLast(100).on("value",snap=>{
    const box=$("chatMessages");
    box.replaceChildren();

    snap.forEach(child=>{
      const msg=child.val()||{};
      const p=document.createElement("div");
      p.className="chatMessage";

      const name=document.createElement("strong");
      name.textContent=msg.senderUid===currentUser.uid
        ?(lang==="ur"?"Aap":"You")
        :(msg.senderName||t("driver"));

      const body=document.createElement("div");
      body.textContent=safeText(msg.text);

      p.append(name,body);
      box.appendChild(p);
    });

    box.scrollTop=box.scrollHeight;
  },error=>{
    console.error(error);
    notify(t("chatError"),"error");
  });

  $("chatCard").scrollIntoView({behavior:"smooth"});
}

$("chatForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("chatInput").value.trim();
  if(!text){
    notify(t("messageRequired"),"error");
    return;
  }
  if(!activeChatOrder)return;

  try{
    const orderSnap=await db.ref("orders/"+activeChatOrder).once("value");
    const order=orderSnap.val();

    if(!order||order.customerUid!==currentUser.uid){
      throw new Error(t("chatError"));
    }

    const msgRef=db.ref("chats/"+activeChatOrder+"/messages").push();
    await msgRef.set({
      senderUid:currentUser.uid,
      senderName:"Customer",
      text:text,
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    $("chatInput").value="";
  }catch(error){
    console.error(error);
    notify(t("sendError"),"error");
  }
});

$("logoutBtn").onclick=async()=>{
  if(chatRef)chatRef.off();
  await auth.signOut();
  location.replace("login.html");
};

auth.onAuthStateChanged(async user=>{
  if(!user){
    location.replace("login.html");
    return;
  }

  currentUser=user;

  try{
    await user.reload();
    currentUser=auth.currentUser;

    if(!currentUser.emailVerified){
      notify(t("verify"),"error");
      return;
    }

    const profileSnap=await db.ref("users/"+currentUser.uid).once("value");
    const profile=profileSnap.val();

    if(!profile||profile.role!=="customer"){
      notify(t("unauthorized"),"error");
      return;
    }

    renderRides();
    applyLanguage();
  }catch(error){
    console.error(error);
    notify(t("profile"),"error");
  }
});

applyLanguage();
</script>
</body>
    </html>
